name: PersonaXP hatırlatmaları
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # her 15 dakikada bir (tam saatlerden kaçınarak)
  workflow_dispatch: {}             # Actions sekmesinden elle de çalıştırılabilir
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Hatırlatmaları gönder
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.mjs
